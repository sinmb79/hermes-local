name: Windows CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run router contract tests
        shell: powershell
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -c "from pathlib import Path; p=Path('router.py'); compile(p.read_bytes(), str(p), 'exec')"

      - name: Parse PowerShell with Windows PowerShell
        shell: powershell
        run: .\scripts\Test-PowerShellSyntax.ps1

      - name: Parse PowerShell with PowerShell 7
        shell: pwsh
        run: .\scripts\Test-PowerShellSyntax.ps1

      - name: Check public manifest, secrets, paths, and links
        shell: powershell
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .\scripts\check_public_release.py --tracked
